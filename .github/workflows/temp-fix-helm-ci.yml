name: Temporary fix Helm CRD assertion

on:
  push:
    branches:
      - docs/enrich-crd-schema
    paths:
      - .github/workflows/temp-fix-helm-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/enrich-crd-schema

      - name: Make CRD name assertion quote-tolerant
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "          grep -F 'name: s3buckets.s3.dajudge.com' <<<\"$rendered\"\n"
          new = "          grep -E 'name: \\\"?s3buckets\\.s3\\.dajudge\\.com\\\"?$' <<<\"$rendered\"\n"
          if old not in text:
              raise SystemExit('Expected Helm CRD assertion not found')
          path.write_text(text.replace(old, new, 1))

      - name: Commit fix and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/temp-fix-helm-ci.yml
          git commit -m "Make Helm CRD assertion quote-tolerant"
          git push origin HEAD:docs/enrich-crd-schema
