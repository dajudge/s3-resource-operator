name: Refactor Operator E2E Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/remove-kind-versity-shim'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Refactor oversized lifecycle test
        run: python .github/refactor-operator-e2e-once.py
      - name: Format and verify Clean Code
        run: |
          mvn --batch-mode --no-transfer-progress -Pformat spotless:apply
          mvn --batch-mode --no-transfer-progress -f config/checkstyle-pom.xml org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
      - name: Commit fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refactor-operator-e2e-once.yml .github/refactor-operator-e2e-once.py .github/refactor-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refactor oversized operator E2E lifecycle test"
          git push origin HEAD:${{ github.head_ref }}
