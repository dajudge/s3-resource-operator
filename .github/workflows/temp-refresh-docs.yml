name: Temporary refresh CRD reference

on:
  push:
    branches:
      - docs/enrich-crd-schema
    paths:
      - .github/workflows/temp-refresh-docs.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: docs/enrich-crd-schema
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Refresh generated docs
        run: ./mvnw --batch-mode --no-transfer-progress -f docs-build/pom.xml verify -Ddocs.update=true

      - name: Commit reference and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/crds.md
          git rm .github/workflows/temp-refresh-docs.yml
          git commit -m "Refresh generated CRD reference"
          git push origin HEAD:docs/enrich-crd-schema
