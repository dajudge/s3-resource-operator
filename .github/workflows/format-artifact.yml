name: Apply Formatting Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-formatting:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Pformat spotless:apply
          git rm .github/workflows/format-artifact.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/java
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Spotless formatting"
          git push origin HEAD:${{ github.head_ref }}
