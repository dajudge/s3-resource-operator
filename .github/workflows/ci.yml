name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          rendered="$(helm template s3-resource-operator charts/s3-resource-operator --include-crds)"
          grep -F 'image: "dajudge/s3-resource-operator:dev"' <<<"$rendered"
          grep -F 'name: s3buckets.s3.dajudge.com' <<<"$rendered"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore
