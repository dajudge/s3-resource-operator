name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            mvn --batch-mode --no-transfer-progress -Pformat validate \
              -Dspotless.ratchetFrom="${{ github.event.before }}"
          else
            mvn --batch-mode --no-transfer-progress -Pformat validate
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress -Punit-tests verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/jacoco-report/**
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  pmd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PMD and CPD
        run: mvn --batch-mode --no-transfer-progress -Ppmd verify -DskipUnitTests=true

  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run SpotBugs
        run: mvn --batch-mode --no-transfer-progress -Pspotbugs verify -DskipUnitTests=true

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate runtime dependency licenses
        run: mvn --batch-mode --no-transfer-progress -Plicenses generate-resources

      - name: Verify runtime dependency licenses
        run: bash hack/check-third-party-licenses.sh

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JVM application
        run: mvn --batch-mode --no-transfer-progress -Punit-tests package -DskipUnitTests=true

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          rendered="$(helm template s3-resource-operator charts/s3-resource-operator --include-crds)"
          grep -F 'image: "dajudge/s3-resource-operator:dev"' <<<"$rendered"
          grep -F 'name: s3buckets.s3.dajudge.com' <<<"$rendered"
          grep -A1 -F 'name: S3_OPERATOR_RESYNC_INTERVAL' <<<"$rendered" | grep -F 'value: "1m"'
          for invalid in garbage 250ms 1d; do
            if helm template s3-resource-operator charts/s3-resource-operator --set reconciliation.resyncInterval="$invalid" >/dev/null 2>&1; then
              echo "invalid reconciliation.resyncInterval unexpectedly accepted: $invalid" >&2
              exit 1
            fi
          done

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: helm-e2e
          wait: 120s

      - name: Install and exercise Helm chart
        run: bash hack/helm-e2e.sh

  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PIT mutation tests
        run: mvn --batch-mode --no-transfer-progress -Punit-tests test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/**
          if-no-files-found: warn

  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native executable
        run: mvn --batch-mode --no-transfer-progress package -Dnative -Dquarkus.native.container-build=true -DskipUnitTests=true

      - name: Build and ABI smoke-test native container
        shell: bash
        run: |
          set -euo pipefail
          runner="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          test -n "$runner"
          docker build \
            -f src/main/docker/Dockerfile.native \
            --build-arg BINARY="$runner" \
            -t s3-resource-operator:native-ci \
            .
          docker run -d \
            --name s3-resource-operator-native-ci \
            s3-resource-operator:native-ci
          trap 'docker logs s3-resource-operator-native-ci || true; docker rm -f s3-resource-operator-native-ci >/dev/null 2>&1 || true' EXIT

          # The operator requires a Kubernetes API and will eventually fail outside a
          # cluster. For this smoke test we only need to prove that the native binary
          # can execute on the runtime image; the old UBI8 image failed immediately
          # with missing GLIBC symbols.
          sleep 5
          logs="$(docker logs s3-resource-operator-native-ci 2>&1 || true)"
          if grep -Eq 'GLIBC_[0-9.]+.*not found|/lib64/libc\.so\.6: version .* not found' <<<"$logs"; then
            echo 'Native runtime image is ABI-incompatible with the executable' >&2
            echo "$logs" >&2
            exit 1
          fi
          if ! docker inspect -f '{{.State.Running}}' s3-resource-operator-native-ci | grep -q true; then
            echo 'Native container exited during ABI smoke test' >&2
            echo "$logs" >&2
            exit 1
          fi
          grep -F 'Quarkus Java Operator SDK extension' <<<"$logs"
