name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            mvn --batch-mode --no-transfer-progress -Pformat validate \
              -Dspotless.ratchetFrom="${{ github.event.before }}"
          else
            mvn --batch-mode --no-transfer-progress -Pformat validate
          fi

  clean-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Enforce Clean Code limits
        run: >-
          mvn --batch-mode --no-transfer-progress -f config/checkstyle-pom.xml
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode --no-transfer-progress -Punit-tests verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/jacoco-report/**
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  pmd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PMD and CPD
        run: mvn --batch-mode --no-transfer-progress -Ppmd verify -DskipUnitTests=true

  spotbugs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run SpotBugs
        run: mvn --batch-mode --no-transfer-progress -Pspotbugs verify -DskipUnitTests=true

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate runtime dependency licenses
        run: mvn --batch-mode --no-transfer-progress -Plicenses generate-resources

      - name: Verify runtime dependency licenses
        run: bash hack/check-third-party-licenses.sh

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JVM application
        run: mvn --batch-mode --no-transfer-progress -Punit-tests package -DskipUnitTests=true

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          rendered="$(helm template s3-resource-operator charts/s3-resource-operator --include-crds)"
          grep -F 'image: "dajudge/s3-resource-operator:dev"' <<<"$rendered"
          grep -F 'name: s3buckets.s3.dajudge.com' <<<"$rendered"
          grep -A1 -F 'name: S3_OPERATOR_RESYNC_INTERVAL' <<<"$rendered" | grep -F 'value: "1m"'
          for invalid in garbage 250ms 1d; do
            if helm template s3-resource-operator charts/s3-resource-operator --set reconciliation.resyncInterval="$invalid" >/dev/null 2>&1; then
              echo "invalid reconciliation.resyncInterval unexpectedly accepted: $invalid" >&2
              exit 1
            fi
          done

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: helm-e2e
          wait: 120s

      - name: Install and exercise Helm chart
        run: bash hack/helm-e2e.sh

  mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PIT mutation tests
        run: mvn --batch-mode --no-transfer-progress -Punit-tests test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/**
          if-no-files-found: warn

  event-source-mutation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run focused event-source PIT tests
        run: >-
          mvn --batch-mode --no-transfer-progress -Punit-tests test-compile
          org.pitest:pitest-maven:mutationCoverage
          -DtargetClasses=com.dajudge.s3operator.reconciler.RelatedResourceEventSources*
          -DtargetTests=com.dajudge.s3operator.reconciler.RelatedResourceEventSourcesTest*

  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native executable
        run: mvn --batch-mode --no-transfer-progress -Plicenses package -Dnative -Dquarkus.native.container-build=true -DskipUnitTests=true

      - name: Build and ABI smoke-test native container
        shell: bash
        run: |
          set -euo pipefail
          runner="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          test -n "$runner"
          docker build \
            -f src/main/docker/Dockerfile.native \
            --build-arg BINARY="$runner" \
            -t s3-resource-operator:native-ci \
            .
          docker run -d \
            --name s3-resource-operator-native-ci \
            s3-resource-operator:native-ci
          trap 'docker logs s3-resource-operator-native-ci || true; docker rm -f s3-resource-operator-native-ci >/dev/null 2>&1 || true' EXIT
          sleep 5
          logs="$(docker logs s3-resource-operator-native-ci 2>&1 || true)"
          if grep -Eq 'GLIBC_[0-9.]+.*not found|/lib64/libc\.so\.6: version .* not found' <<<"$logs"; then
            echo 'Native runtime image is ABI-incompatible with the executable' >&2
            echo "$logs" >&2
            exit 1
          fi
          if ! docker inspect -f '{{.State.Running}}' s3-resource-operator-native-ci | grep -q true; then
            echo 'Native container exited during ABI smoke test' >&2
            echo "$logs" >&2
            exit 1
          fi
          grep -F 'Quarkus Java Operator SDK extension' <<<"$logs"

  verify:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - clean-code
      - unit-tests
      - pmd
      - spotbugs
      - licenses
      - helm
      - mutation-test
      - event-source-mutation-test
      - native-build

    steps:
      - name: Verify required checks
        run: |
          test "${{ needs.format.result }}" = success
          test "${{ needs.clean-code.result }}" = success
          test "${{ needs.unit-tests.result }}" = success
          test "${{ needs.pmd.result }}" = success
          test "${{ needs.spotbugs.result }}" = success
          test "${{ needs.licenses.result }}" = success
          test "${{ needs.helm.result }}" = success
          test "${{ needs.mutation-test.result }}" = success
          test "${{ needs.event-source-mutation-test.result }}" = success
          test "${{ needs.native-build.result }}" = success

  publish-quality-badges:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: /tmp/jacoco

      - name: Download PIT report
        uses: actions/download-artifact@v4
        with:
          name: pit-report
          path: /tmp/pit

      - name: Generate Shields endpoint data
        shell: python
        run: |
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          output = Path('/tmp/quality-badges')
          output.mkdir(parents=True, exist_ok=True)

          jacoco = ET.parse('/tmp/jacoco/jacoco.xml').getroot()
          counters = {
              counter.attrib['type']: (int(counter.attrib['covered']), int(counter.attrib['missed']))
              for counter in jacoco.findall('counter')
          }

          mutations = ET.parse('/tmp/pit/mutations.xml').getroot().findall('mutation')
          detected = sum(mutation.attrib.get('detected') == 'true' for mutation in mutations)

          def percentage(covered, missed=0):
              total = covered + missed
              return 100.0 if total == 0 else covered * 100.0 / total

          def color(value):
              if value >= 90:
                  return 'brightgreen'
              if value >= 80:
                  return 'green'
              if value >= 70:
                  return 'yellowgreen'
              if value >= 60:
                  return 'yellow'
              return 'red'

          def write(name, label, value):
              message = f'{value:.1f}'.rstrip('0').rstrip('.') + '%'
              data = {
                  'schemaVersion': 1,
                  'label': label,
                  'message': message,
                  'color': color(value),
              }
              (output / f'{name}.json').write_text(json.dumps(data) + '\n')

          line_covered, line_missed = counters['LINE']
          branch_covered, branch_missed = counters['BRANCH']
          write('line-coverage', 'line coverage', percentage(line_covered, line_missed))
          write('branch-coverage', 'branch coverage', percentage(branch_covered, branch_missed))
          write('mutation-score', 'mutation score', percentage(detected, len(mutations) - detected))

      - name: Publish badge data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if git fetch origin badges:refs/remotes/origin/badges 2>/dev/null; then
            git switch --force-create badges refs/remotes/origin/badges
            git rm -rf .
          else
            git switch --orphan badges
            git rm -rf . || true
          fi

          mkdir -p metrics
          cp /tmp/quality-badges/*.json metrics/
          git add metrics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update quality metrics for ${GITHUB_SHA}"
          git push origin badges
