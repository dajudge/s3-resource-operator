name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Verify runtime dependency licenses
        run: bash hack/check-third-party-licenses.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          rendered="$(helm template s3-resource-operator charts/s3-resource-operator --include-crds)"
          grep -F 'image: "dajudge/s3-resource-operator:dev"' <<<"$rendered"
          grep -F 'name: s3buckets.s3.dajudge.com' <<<"$rendered"
          grep -A1 -F 'name: S3_OPERATOR_RESYNC_INTERVAL' <<<"$rendered" | grep -F 'value: "1m"'
          for invalid in garbage 250ms 1d; do
            if helm template s3-resource-operator charts/s3-resource-operator --set reconciliation.resyncInterval="$invalid" >/dev/null 2>&1; then
              echo "invalid reconciliation.resyncInterval unexpectedly accepted: $invalid" >&2
              exit 1
            fi
          done

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: helm-e2e
          wait: 120s

      - name: Install and exercise Helm chart
        run: bash hack/helm-e2e.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native executable
        run: mvn --batch-mode --no-transfer-progress package -Dnative -Dquarkus.native.container-build=true -DskipUnitTests=true

      - name: Build and smoke-test native container
        shell: bash
        run: |
          set -euo pipefail
          runner="$(find target -maxdepth 1 -type f -name '*-runner' -print -quit)"
          test -n "$runner"
          docker build \
            -f src/main/docker/Dockerfile.native \
            --build-arg BINARY="$runner" \
            -t s3-resource-operator:native-ci \
            .
          docker run -d \
            --name s3-resource-operator-native-ci \
            -e QUARKUS_OPERATOR_SDK_START_OPERATOR=false \
            -p 127.0.0.1:18080:8080 \
            s3-resource-operator:native-ci
          trap 'docker logs s3-resource-operator-native-ci || true; docker rm -f s3-resource-operator-native-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/q/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' s3-resource-operator-native-ci | grep -q true; then
              echo 'Native container exited before becoming healthy' >&2
              exit 1
            fi
            sleep 1
          done
          echo 'Native container did not become healthy' >&2
          exit 1
