name: Release

on:
  push:
    tags:
      - 'release/*'
    branches:
      - 'release-trigger/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-tag:
    if: startsWith(github.ref, 'refs/heads/release-trigger/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version, create release tag, and dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release-trigger/}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid release trigger: $GITHUB_REF_NAME" >&2
            echo "Expected release-trigger/<semver>, for example release-trigger/1.2.3-rc.1" >&2
            exit 1
          fi
          tag="release/${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag already exists: ${tag}" >&2
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          gh workflow run release.yml --ref "$tag"

  validate:
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            echo "Expected release/<semver> without build metadata, for example release/1.2.3 or release/1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    if: startsWith(github.ref, 'refs/tags/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify JVM build
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify runtime dependency licenses
        run: bash hack/check-third-party-licenses.sh

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          rendered="$(helm template s3-resource-operator charts/s3-resource-operator --include-crds)"
          grep -F 'image: "dajudge/s3-resource-operator:dev"' <<<"$rendered"
          grep -F 'name: s3buckets.s3.dajudge.com' <<<"$rendered"

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: helm-e2e
          wait: 120s

      - name: Install and exercise Helm chart
        run: bash hack/helm-e2e.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-jvm-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  native:
    needs:
      - validate
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test native executable
        run: >-
          ./mvnw --batch-mode --no-transfer-progress verify
          -Dnative
          -Dquarkus.native.container-build=true
          -DskipUnitTests=true

      - name: Upload native test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-test-reports-${{ matrix.arch }}
          path: |
            target/failsafe-reports/**
            target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload tested native executable
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.arch }}
          path: target/*-runner
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - validate
      - native
    runs-on: ubuntu-latest
    env:
      IMAGE: dajudge/s3-resource-operator
      VERSION: ${{ needs.validate.outputs.version }}
      CHART_OCI_REPOSITORY: oci://registry-1.docker.io/dajudge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate runtime dependency licenses
        run: |
          ./mvnw --batch-mode --no-transfer-progress generate-resources -DskipTests
          bash hack/check-third-party-licenses.sh

      - name: Download amd64 executable
        uses: actions/download-artifact@v8
        with:
          name: native-amd64
          path: dist/amd64

      - name: Download arm64 executable
        uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: dist/arm64

      - name: Normalize executable names
        shell: bash
        run: |
          set -euo pipefail
          mv "$(find dist/amd64 -maxdepth 1 -type f -name '*-runner' -print -quit)" dist/amd64/application
          mv "$(find dist/arm64 -maxdepth 1 -type f -name '*-runner' -print -quit)" dist/arm64/application

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Package and validate Helm chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/chart
          helm package charts/s3-resource-operator \
            --destination dist/chart \
            --version "$VERSION" \
            --app-version "$VERSION"
          chart="dist/chart/s3-resource-operator-chart-${VERSION}.tgz"
          rendered="$(helm template s3-resource-operator "$chart")"
          grep -F "image: \"${IMAGE}:${VERSION}\"" <<<"$rendered"

      - name: Package license bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/licenses
          cp target/generated-sources/license/THIRD-PARTY-NOTICES.txt dist/licenses/
          tar -czf "dist/licenses/s3-resource-operator-licenses-${VERSION}.tar.gz" \
            LICENSE \
            target/generated-sources/license/THIRD-PARTY-NOTICES.txt \
            target/generated-resources/licenses.xml \
            target/generated-resources/licenses

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-amd64
          build-args: BINARY=dist/amd64/application

      - name: Push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-arm64
          build-args: BINARY=dist/arm64/application

      - name: Publish multi-arch version tag
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE}:${VERSION}"
          "${IMAGE}:${VERSION}-amd64"
          "${IMAGE}:${VERSION}-arm64"

      - name: Publish latest tag
        if: needs.validate.outputs.prerelease == 'false'
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE}:latest"
          "${IMAGE}:${VERSION}-amd64"
          "${IMAGE}:${VERSION}-arm64"

      - name: Log in Helm to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | \
            helm registry login registry-1.docker.io \
              --username '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

      - name: Push Helm chart OCI artifact
        run: helm push "dist/chart/s3-resource-operator-chart-${VERSION}.tgz" "$CHART_OCI_REPOSITORY"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/chart/s3-resource-operator-chart-${{ env.VERSION }}.tgz
            dist/licenses/THIRD-PARTY-NOTICES.txt
            dist/licenses/s3-resource-operator-licenses-${{ env.VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist/release

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          args=(
            "release/${VERSION}"
            --verify-tag
            --title "${VERSION}"
            --generate-notes
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" \
            "dist/release/chart/s3-resource-operator-chart-${VERSION}.tgz" \
            "dist/release/licenses/THIRD-PARTY-NOTICES.txt" \
            "dist/release/licenses/s3-resource-operator-licenses-${VERSION}.tar.gz"
