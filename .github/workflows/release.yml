name: Release

on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            echo "Expected release/<semver>, for example release/1.2.3 or release/1.2.3-rc.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify JVM build
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm chart
        run: |
          set -euo pipefail
          helm lint charts/s3-resource-operator
          helm template s3-resource-operator charts/s3-resource-operator --include-crds >/dev/null

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-jvm-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  native:
    needs:
      - validate
      - verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test native executable
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          -Dnative
          -Dquarkus.native.container-build=true
          -DskipUnitTests=true

      - name: Upload native test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports-${{ matrix.arch }}
          path: |
            target/failsafe-reports/**
            target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload tested native executable
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: target/*-runner
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - validate
      - native
    runs-on: ubuntu-latest
    env:
      IMAGE: dajudge/s3-resource-operator
      VERSION: ${{ needs.validate.outputs.version }}
      CHART_OCI_REPOSITORY: oci://registry-1.docker.io/dajudge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 executable
        uses: actions/download-artifact@v5
        with:
          name: native-amd64
          path: dist/amd64

      - name: Download arm64 executable
        uses: actions/download-artifact@v5
        with:
          name: native-arm64
          path: dist/arm64

      - name: Normalize executable names
        shell: bash
        run: |
          set -euo pipefail
          mv "$(find dist/amd64 -maxdepth 1 -type f -name '*-runner' -print -quit)" dist/amd64/application
          mv "$(find dist/arm64 -maxdepth 1 -type f -name '*-runner' -print -quit)" dist/arm64/application

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-amd64
          build-args: BINARY=dist/amd64/application

      - name: Push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-arm64
          build-args: BINARY=dist/arm64/application

      - name: Publish multi-arch version tag
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE}:${VERSION}"
          "${IMAGE}:${VERSION}-amd64"
          "${IMAGE}:${VERSION}-arm64"

      - name: Publish latest tag
        if: needs.validate.outputs.prerelease == 'false'
        run: >-
          docker buildx imagetools create
          --tag "${IMAGE}:latest"
          "${IMAGE}:${VERSION}-amd64"
          "${IMAGE}:${VERSION}-arm64"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/chart
          helm package charts/s3-resource-operator \
            --destination dist/chart \
            --version "$VERSION" \
            --app-version "$VERSION"
          chart="dist/chart/s3-resource-operator-chart-${VERSION}.tgz"
          rendered="$(helm template s3-resource-operator "$chart")"
          grep -F "image: \"${IMAGE}:${VERSION}\"" <<<"$rendered"

      - name: Log in Helm to Docker Hub
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | \
            helm registry login registry-1.docker.io \
              --username '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

      - name: Push Helm chart OCI artifact
        run: helm push "dist/chart/s3-resource-operator-chart-${VERSION}.tgz" "$CHART_OCI_REPOSITORY"
