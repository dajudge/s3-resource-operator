name: Published release E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to install and validate
        required: true

permissions:
  contents: read

jobs:
  published-release-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLISHED_VERSION: ${{ inputs.version }}
      KIND_CLUSTER_NAME: published-release-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: published-release-e2e
          wait: 120s

      - name: Install published release and upgrade to HEAD chart
        run: bash hack/published-release-e2e.sh
