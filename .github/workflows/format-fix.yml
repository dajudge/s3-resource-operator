name: Temporary format fix

on:
  push:
    branches:
      - refactor/e2e-fixtures

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply Spotless and remove temporary workflow
        run: |
          mvn --batch-mode --no-transfer-progress spotless:apply -Dspotless.ratchetFrom=origin/main
          git rm .github/workflows/format-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply Spotless formatting"
            git push
          fi
