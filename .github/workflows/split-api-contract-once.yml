name: Split API Contract E2E Once

on:
  push:
    branches:
      - test/split-api-contract-e2e

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/split-api-contract-e2e
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Split API contract tests
        run: python .github/split-api-contract.py
      - name: Format and verify Clean Code
        run: |
          mvn --batch-mode --no-transfer-progress -Pformat spotless:apply -Dspotless.ratchetFrom=""
          mvn --batch-mode --no-transfer-progress -f config/checkstyle-pom.xml org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
      - name: Commit split and remove helpers
        run: |
          set -euo pipefail
          rm .github/split-api-contract.py .github/workflows/split-api-contract-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/java/com/dajudge/s3operator/ExistingBehaviorE2ETest.java src/test/java/com/dajudge/s3operator/ApiContractE2ETest.java .github/split-api-contract.py .github/workflows/split-api-contract-once.yml
          git commit -m "Split API contract E2E coverage"
          git push origin HEAD:test/split-api-contract-e2e
