name: Split Secret Lifecycle E2E Once

on:
  push:
    branches:
      - test/split-secret-lifecycle-e2e

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/split-secret-lifecycle-e2e
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Split secret lifecycle tests
        run: python .github/scripts/split-secret-lifecycle.py
      - name: Format and verify Clean Code
        run: |
          mvn --batch-mode --no-transfer-progress -Pformat spotless:apply -Dspotless.ratchetFrom=""
          mvn --batch-mode --no-transfer-progress -f config/checkstyle-pom.xml org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
      - name: Commit split and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/split-secret-lifecycle-once.yml
          rm .github/scripts/split-secret-lifecycle.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/java/com/dajudge/s3operator/ExistingBehaviorE2ETest.java \
                  src/test/java/com/dajudge/s3operator/OperatorE2ETestSupport.java \
                  src/test/java/com/dajudge/s3operator/SecretLifecycleE2ETest.java \
                  .github/workflows/split-secret-lifecycle-once.yml \
                  .github/scripts/split-secret-lifecycle.py
          git commit -m "Split secret lifecycle E2E coverage"
          git push origin HEAD:test/split-secret-lifecycle-e2e
