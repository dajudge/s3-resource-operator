name: Validate Lifecycle Refactor Once

on:
  push:
    branches:
      - test/split-secret-lifecycle-e2e

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: test/split-secret-lifecycle-e2e
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format and verify Clean Code
        run: |
          mvn --batch-mode --no-transfer-progress -Pformat spotless:apply -Dspotless.ratchetFrom=""
          mvn --batch-mode --no-transfer-progress -f config/checkstyle-pom.xml org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/validate-lifecycle-refactor-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/test/java/com/dajudge/s3operator/ExistingBehaviorE2ETest.java \
                  src/test/java/com/dajudge/s3operator/LifecycleBehaviorE2ETest.java \
                  src/test/java/com/dajudge/s3operator/OperatorE2ETestSupport.java \
                  .github/workflows/validate-lifecycle-refactor-once.yml
          git commit -m "Validate lifecycle E2E refactor"
          git push origin HEAD:test/split-secret-lifecycle-e2e
